<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#05120c" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f4f8f5" media="(prefers-color-scheme: light)" />
    <meta
      name="description"
      content="NyaySetu anchors evidence, summons and bail conditions to a public blockchain, so integrity is something anyone can verify rather than something a party asserts."
    />

    <title>NyaySetu — Bridge of Justice</title>

    <!--
      The logo's white strokes are negative space, so a transparent favicon
      vanishes on a dark browser tab. Every icon here is pre-composited onto an
      opaque white plate, which is also why there is no SVG version: the plate
      has to be baked in.
    -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <meta property="og:title" content="NyaySetu - Bridge of Justice" />
    <meta
      property="og:description"
      content="Evidence digests, summons acknowledgements and bail conditions anchored to a public blockchain."
    />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Fonts. preconnect first so the handshake overlaps HTML parsing. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..700&family=Montserrat:ital,wght@0,300..800;1,300..700&family=Inter:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <!--
      Retro dot-matrix face for the landing page stat glyphs only. Served by
      OnlineWebFonts; if it fails the display stack falls back to Geist Pixel
      Circle and then to monospace, so nothing breaks.
    -->
    <link
      href="https://db.onlinewebfonts.com/c/8cb707a9b8a73f8a7403336b861c3074?family=BubbledotICG-FinePos"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      NyaySetu needs JavaScript: evidence digests are computed in your browser
      before anything is uploaded, which is not something a server can do for you.
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
